[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repetia-decision-engine"
version = "1.0.0"
description = "Reusable, policy-driven decision and governance engine for agentic applications"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["decision_engine"]
package-dir = {"decision_engine" = "."}
