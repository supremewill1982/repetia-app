name: One-time AI backend migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace direct Gemini transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/services/iaServiceOpenRouter.ts')
          text = path.read_text()

          pattern = re.compile(
              r"import axios from 'axios';.*?(?=let niveauEleve = 'Terminale';)",
              re.S,
          )

          replacement = "import { appelerGeminiBackend } from './iaBackendService';\n\nconst appelerGemini = appelerGeminiBackend;\n\n"

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Migration pattern not found; refusing to modify the AI service.')

          path.write_text(updated)
          PY

      - name: Verify TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: Commit migration
        run: |
          if git diff --quiet -- src/services/iaServiceOpenRouter.ts; then
            echo 'AI transport already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/iaServiceOpenRouter.ts
          git commit -m 'security(ai): route Gemini calls through Supabase'
          git push origin HEAD:main
