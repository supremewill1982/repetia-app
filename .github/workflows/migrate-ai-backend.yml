name: One-time AI backend migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify secure Gemini transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/services/iaServiceOpenRouter.ts')
          text = path.read_text()
          if "from './iaBackendService'" not in text or not re.search(r"const\s+appelerGemini\s*=\s*appelerGeminiBackend", text):
              raise SystemExit('Secure Gemini transport is not wired to iaBackendService; refusing to continue.')
          if 'GEMINI_API_KEY' in text or 'generativelanguage.googleapis.com' in text or "axios.post" in text:
              raise SystemExit('Direct Gemini transport or client-side Gemini key reference detected; refusing to continue.')
          print('Secure Gemini transport verified.')
          PY

      - name: Verify TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: Verify Expo config has no Gemini key exposure
        run: |
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git -E 'EXPO_PUBLIC_GEMINI_API_KEY|process\.env\.EXPO_PUBLIC_GEMINI_API_KEY|extra:.*geminiApiKey|geminiApiKey:' app.config.js app.json 2>/dev/null; then
            echo 'Client-side Gemini key exposure detected.'
            exit 1
          fi
          echo 'No Gemini API key exposure found in Expo config.'

      - name: Commit migration
        run: |
          echo 'Secure AI migration already present and verified.'
