name: Deploy Firebase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - '.github/workflows/deploy-firebase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Typecheck Firebase Functions
        working-directory: functions
        run: npm run build

      - name: Prepare server-side Gemini runtime parameter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: functions
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY manquant dans GitHub Secrets'; exit 1; }
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env.monappedu-f6048
          chmod 600 .env.monappedu-f6048

      - name: Deploy Firebase backend and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN" || { echo 'FIREBASE_TOKEN manquant dans GitHub Secrets'; exit 1; }
          npx firebase-tools deploy --only functions,firestore:rules --token "$FIREBASE_TOKEN" --project monappedu-f6048 --non-interactive
