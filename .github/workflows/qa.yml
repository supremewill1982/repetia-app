name: QA RÉPÉTIA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Jest
        run: npm test -- --runInBand
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Firebase Functions build
        working-directory: functions
        run: |
          npm ci
          npm run build
