name: QA RÉPÉTIA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize app lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Synchronize Firebase Functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfiles
        run: |
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            echo "Lockfiles already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json functions/package-lock.json
            git commit -m "chore(deps): synchronize app and functions lockfiles"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit (production)
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          AUDIT_EXIT=$?
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "::warning::npm audit signale des vulnérabilités dans la chaîne de dépendances. Aucun npm audit fix --force n'est appliqué automatiquement car il proposerait un passage à Expo 57, rupture majeure pour le projet SDK 54."
          fi
          exit 0
      - name: TypeScript
        run: npm run typecheck
      - name: Jest
        run: npm test -- --runInBand
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Firebase Functions build
        working-directory: functions
        run: |
          npm ci
          npm run build
