name: Build Expo APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📱 Setup Java (pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🏗️ Installer Expo et EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: 🔑 Authentification Expo
        run: eas login --non-interactive --token ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Build APK avec EAS
        run: eas build --platform android --profile preview --non-interactive --output ./app-build.apk

      - name: 📤 Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: repetia-apk
          path: ./app-build.apk
