name: Build Expo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📱 Setup Java (pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🧪 Vérifier TypeScript
        run: npx tsc --noEmit

      - name: 🏗️ Installer EAS CLI
        run: npm install -g eas-cli

      - name: 🔑 Vérifier EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"

      - name: 🚀 Build APK avec EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json
          APK_URL=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(x)?x[0]:x; const u=b?.artifacts?.buildUrl||b?.artifacts?.applicationArchiveUrl; if(!u) process.exit(2); process.stdout.write(u)")
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          curl -fL "$APK_URL" -o repetia-preview.apk

      - name: 📦 Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: repetia-preview-apk
          path: repetia-preview.apk
          if-no-files-found: error

      - name: 🔍 Vérifier l'APK
        run: |
          test -s repetia-preview.apk
          file repetia-preview.apk
          ls -lh repetia-preview.apk
