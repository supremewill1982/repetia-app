name: Build Expo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📱 Setup Java (pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK (fallback local)
        uses: android-actions/setup-android@v3

      - name: 📱 Installer les composants Android nécessaires
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🧪 Vérifier TypeScript
        run: npx tsc --noEmit

      - name: 🏗️ Installer EAS CLI
        run: npm install -g eas-cli

      - name: 🔑 Vérifier EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"

      - name: 🚀 Build APK — EAS cloud puis fallback local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          echo "Tentative 1: EAS Build cloud"
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          CLOUD_EXIT=$?

          if [ "$CLOUD_EXIT" -eq 0 ]; then
            echo "Build cloud réussi."
            cat eas-build.json
            APK_URL=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(x)?x[0]:x; const u=b?.artifacts?.buildUrl||b?.artifacts?.applicationArchiveUrl; if(!u) process.exit(2); process.stdout.write(u)")
            curl -fL "$APK_URL" -o repetia-preview.apk
          else
            echo "Build cloud indisponible (quota ou erreur distante). Tentative 2: EAS Build local."
            rm -f eas-build.json
            eas build --platform android --profile preview --local --non-interactive --output repetia-preview.apk
            LOCAL_EXIT=$?
            if [ "$LOCAL_EXIT" -ne 0 ]; then
              echo "Build local EAS échoué avec le code $LOCAL_EXIT"
              exit "$LOCAL_EXIT"
            fi
          fi

      - name: 📦 Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: repetia-preview-apk
          path: repetia-preview.apk
          if-no-files-found: error

      - name: 🔍 Vérifier l'APK
        run: |
          test -s repetia-preview.apk
          file repetia-preview.apk
          ls -lh repetia-preview.apk
