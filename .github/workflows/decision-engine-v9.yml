name: Decision Engine V9

on:
  push:
    branches:
      - fix/decision-engine-v9
  workflow_dispatch:

jobs:
  adversarial-v9:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: V9 adversarial suite
        run: python tests/run_v9.py
