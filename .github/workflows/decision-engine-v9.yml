name: Decision Engine V9

on:
  push:
    branches:
      - fix/decision-engine-v9
  workflow_dispatch:

jobs:
  adversarial-v9:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install package
        run: python -m pip install -e .
      - name: V9 adversarial suite
        run: python tests/run_v9.py
      - name: Contract, engine and audit and cross-domain tests
        run: python -m unittest test_contracts.py test_engine.py test_public_api.py test_audit.py test_cross_domain.py
